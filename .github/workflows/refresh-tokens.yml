name: LovableGG Token Refresher

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Install Chromium
        run: npx puppeteer browsers install chrome

      - name: Run token refresher
        run: node refresher.js
        timeout-minutes: 8
